name: Android APK and verification

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter and Dart versions
        run: flutter --version && dart --version
      - name: Core dependencies, tests, and analysis
        run: |
          dart pub get
          dart test
          dart analyze lib test
      - name: App dependencies, tests, and analysis
        working-directory: flutter_example
        run: |
          flutter pub get
          flutter test
          flutter analyze --no-fatal-infos
      - name: Build split debug APKs
        working-directory: flutter_example
        run: flutter build apk --debug --split-per-abi
      - name: Upload installable debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: pid-tuner-pro-android-debug
          path: flutter_example/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 90
      - name: Publish APKs to preview release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          apk_dir=flutter_example/build/app/outputs/flutter-apk
          sha256sum "$apk_dir"/*.apk > "$apk_dir/SHA256SUMS"
          gh release view android-preview >/dev/null 2>&1 || \
            gh release create android-preview \
              --target "$GITHUB_SHA" \
              --prerelease \
              --title "PID Tuner Pro Android preview" \
              --notes "Debug APKs built from the latest successful main branch run."
          gh release upload android-preview "$apk_dir"/*.apk "$apk_dir/SHA256SUMS" --clobber
